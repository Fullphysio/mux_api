# The hand-maintained map from Mux operations to the Dart API, transcribed
# from muxinc/mux-ts api.md (the namespace and method names are curated
# upstream and cannot be derived from the specification). Everything else —
# host, path parameters, request body, query parameters, response shape and
# the `data` unwrap — is derived from tool/spec/mux-openapi.json.
#
# Keys are `VERB /path` exactly as written in the specification. `page` names
# the pagination shape upstream uses (base | cursor | withTimeframe |
# withTotal); it is NOT inferable from the response schema (ListIncidents
# carries total_row_count yet upstream reads only `data`), so it is pinned
# here. Omitted means the operation is not a list.

spec:
  muxTsTag: v15.1.0

exclude:
  - operation: "POST /video/v1/signing-keys"
    reason: Deprecated; superseded by system.signingKeys.create.
  - operation: "GET /video/v1/signing-keys"
    reason: Deprecated; superseded by system.signingKeys.list.
  - operation: "GET /video/v1/signing-keys/{SIGNING_KEY_ID}"
    reason: Deprecated; superseded by system.signingKeys.retrieve.
  - operation: "DELETE /video/v1/signing-keys/{SIGNING_KEY_ID}"
    reason: Deprecated; superseded by system.signingKeys.delete.
  - operation: "GET /counts"
    reason: stats.mux.com viewer counts without an API version; absent from @mux/ts.

